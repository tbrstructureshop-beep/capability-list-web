<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoGS Context View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary: #286573;
            --primary-light: #eef6f7;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            margin: 0; padding: 20px; 
            height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; 
        }

        /* Header Style */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .title-group { display: flex; align-items: center; gap: 12px; }
        .pn-chip { 
            background: var(--primary); color: white; padding: 4px 12px; 
            border-radius: 6px; font-size: 0.85rem; font-weight: 700; 
        }

        /* Table Style */
        .table-wrapper { 
            background: white; border-radius: 12px; border: 1px solid var(--border); 
            overflow: auto; flex-grow: 1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { 
            position: sticky; top: 0; background: #f1f5f9; padding: 14px; 
            font-size: 0.7rem; text-transform: uppercase; color: var(--text-light); 
            text-align: center; border-bottom: 2px solid var(--border); z-index: 10;
        }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.85rem; text-align: center; }
        
        .align-left { text-align: left !important; }

        /* Loader */
        .loader { 
            position: fixed; inset: 0; background: rgba(255,255,255,0.8); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; 
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Status Pills */
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; color: white; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="loading" class="loader">
        <div class="spinner"></div>
        <p style="font-size: 0.7rem; font-weight: 700; color: var(--primary); margin-top: 10px;">FILTERING SERIES DATA...</p>
    </div>

    <div class="header">
        <div class="title-group">
            <span class="material-icons" style="color: var(--primary)">account_balance_wallet</span>
            <h2 style="margin:0; font-size: 1.1rem; color: var(--primary)">CoGS Master Records</h2>
            <div id="contextPnDisplay" class="pn-chip">All Records</div>
        </div>
        <button onclick="window.parent.postMessage({type:'CLOSE_MODAL'}, '*')" style="background:none; border:none; cursor:pointer; color:var(--text-light)">
            <span class="material-icons">close</span>
        </button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 120px;">Ref No</th>
                    <th class="align-left">CoGS Part Identification</th>
                    <th style="width: 100px;">A/C Reg</th>
                    <th style="width: 120px;">Category</th>
                    <th style="width: 120px;">Status</th>
                    <th style="width: 150px;">PIC</th>
                    <th style="width: 80px;">Link</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>

<script>
    // API from Repo 1
    const API_URL = "https://script.google.com/macros/s/AKfycbykCrJU0KPIYW9TVdLZNw-OAillhUjc1QcFG3xTflN4Yb1UmOwCr3YB6jiKgcUMkB2N/exec";
    
    // Get PN from URL (Context)
    const urlParams = new URLSearchParams(window.location.search);
    const targetPn = urlParams.get('pn');

    if (targetPn) {
        document.getElementById('contextPnDisplay').innerText = `Target: ${targetPn}`;
    }

    async function fetchAndFilter() {
        try {
            const res = await fetch(`${API_URL}?action=getCoGSList`);
            const json = await res.json();
            
            if (json.status === "success") {
                let data = json.data;

                // SMART FAA FILTERING LOGIC
                if (targetPn) {
                    data = data.filter(item => {
                        // 1. Clean the database PN string (remove quotes, newlines)
                        const dbPnString = String(item.pn || "").replace(/["\r\n]/g, " ").toUpperCase();
                        
                        // 2. Clean the target PN (handle potential "-SERIES" suffixes if necessary)
                        const searchPn = targetPn.toUpperCase().trim();

                        // 3. Match Logic: Check if target exists as a word or substring in the series
                        // This works for "325-026-001-0" matching a cell containing "325-026-001-0; 325-034-901-0"
                        return dbPnString.includes(searchPn);
                    });
                }

                renderTable(data);
            }
        } catch (e) {
            console.error(e);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderTable(data) {
        const body = document.getElementById('logBody');
        const statusColors = { 'Approved': '#286573', 'Submitted': '#16a34a', 'Revised': '#d97706', 'Created': '#94a3b8' };

        if (data.length === 0) {
            body.innerHTML = `<tr><td colspan="7" style="padding:100px; color:var(--text-light)">No CoGS records found for this Part Number series.</td></tr>`;
            return;
        }

        body.innerHTML = data.map(row => `
            <tr>
                <td style="font-weight:700; color:var(--primary); font-family:monospace;">${row.orderNo}</td>
                <td class="align-left">
                    <div style="font-weight:700; font-size:0.8rem;">${row.pn}</div>
                    <div style="font-size:0.65rem; color:var(--text-light); text-transform:uppercase;">${row.desc}</div>
                </td>
                <td style="font-weight:600;">${row.acReg}</td>
                <td style="font-size:0.75rem;">${row.category}</td>
                <td>
                    <span class="status-pill" style="background:${statusColors[row.status] || '#94a3b8'}">
                        ${row.status}
                    </span>
                </td>
                <td style="font-weight:600; font-size:0.8rem;">${row.pic}</td>
                <td>
                    <a href="${row.url}" target="_blank" class="material-icons" style="text-decoration:none; color:var(--primary); font-size:1.2rem;">open_in_new</a>
                </td>
            </tr>
        `).join('');
    }

    fetchAndFilter();
</script>
</body>
</html>
